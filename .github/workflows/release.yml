name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build release bundle
        run: make release

      - name: Capture artifacts
        id: artifacts
        run: |
          echo "sha=$(cut -d' ' -f1 Veil.zip.sha256)" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h Veil.zip | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ steps.artifacts.outputs.sha }}
          SIZE: ${{ steps.artifacts.outputs.size }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "Ad-hoc signed build of Veil (arm64). On first launch, right-click \`Veil.app\` and choose **Open** to bypass Gatekeeper.

          - **SHA-256:** \`$SHA\`
          - **Size:** $SIZE

          See [README](https://github.com/${{ github.repository }}/blob/main/README.md) for setup." \
            Veil.zip Veil.zip.sha256
